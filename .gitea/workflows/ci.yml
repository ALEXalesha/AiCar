# Проверки на домашнем Gitea. Копия .github/workflows/ci.yml, отличие одно: задачи
# идут на раннер ПК (метка windows), а не на windows-latest / ubuntu-latest - такие метки
# есть только у раннера ноутбука, и без него задачи висели в очереди и отменялись.
# Раз папка .gitea/workflows есть, Gitea берёт проверки только отсюда: выпуски и Pages -
# дело GitHub, здесь их нет. Меняя проверки, править оба файла.

# Проверки на каждый пуш.
#
# Раннер windows: панель меряется в пикселях отрисованного текста, а шрифт берётся
# системный (`consolas`). На linux его нет, pygame молча подставит другой, метрики
# разъедутся - и проверки ширины строк начнут падать не из-за кода.
#
# Окно не нужно: и тесты, и проверка инвариантов сами ставят SDL_VIDEODRIVER=dummy,
# то есть рисуют в поверхность в памяти.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Python ПК (3.13) в своём окружении, а не setup-python: тот ставит Python
      # установщиком, которому нужны права администратора на реестр, - у раннера их нет.
      - name: Python в отдельном окружении
        run: |
          py -3.13 -m venv .ci-venv
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$((Resolve-Path .ci-venv).Path)\Scripts`n")

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q

      # Один круг вместо десяти: десять это десять минут, а нарушение инварианта
      # почти никогда не держится за один конкретный сид.
      # -v печатает каждое свойство с временем: если круг встанет, по логу видно где.
      - name: Инварианты на случайных данных, один круг
        timeout-minutes: 12
        run: python stress.py --rounds 1 -v
