# Проверки на каждый пуш.
#
# Раннер windows: панель меряется в пикселях отрисованного текста (QFontMetrics), а шрифт
# берётся системный (Consolas). На linux его нет, Qt молча подставит другой, метрики
# разъедутся - и проверки ширины строк начнут падать не из-за кода.
#
# Окно не нужно: Qt с платформой offscreen рисует в картинку в памяти, шрифты берёт из
# папки Windows (offscreen.py; тесты и stress.py ставят это и сами).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q

      # Один круг вместо десяти: десять это десять минут, а нарушение инварианта
      # почти никогда не держится за один конкретный сид.
      # -v печатает каждое свойство с временем: если круг встанет, по логу видно где.
      - name: Инварианты на случайных данных, один круг
        timeout-minutes: 12
        run: python stress.py --rounds 1 -v
