# Проверки на каждый пуш.
#
# Раннер windows: панель меряется в пикселях отрисованного текста, а шрифт берётся
# системный (`consolas`). На linux его нет, pygame молча подставит другой, метрики
# разъедутся - и проверки ширины строк начнут падать не из-за кода.
#
# Окно не нужно: и тесты, и проверка инвариантов сами ставят SDL_VIDEODRIVER=dummy,
# то есть рисуют в поверхность в памяти.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: 277 тестов
        run: python -m pytest -q

      # Один круг вместо десяти: десять это десять минут, а нарушение инварианта
      # почти никогда не держится за один конкретный сид.
      - name: Инварианты на случайных данных, один круг
        run: python stress.py --rounds 1
